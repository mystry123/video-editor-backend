name: Deploy

# Deploys this app to the production VM (GCP shotline-app):
# - after CI passes on main, when the repo variable AUTO_DEPLOY is "true";
# - manually: Actions → Deploy → Run workflow (on main) with a commit of main,
#   to deploy, redeploy or roll back.
# Auth: GitHub OIDC → Workload Identity Federation (provider github/shotline-app,
# this repo's main branch only) → app-deployer@, which may only SSH to this VM
# through IAP and run `sudo shotline-deploy`. No keys in GitHub.
# The VM side (deploy/gcp/shotline-deploy + app-deploy in video-editor-backend)
# refuses commits not on origin/main, waits for running jobs, health-checks and
# rolls back on failure.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to deploy (full or short SHA)"
        required: true

permissions:
  contents: read
  id-token: write   # OIDC token for Workload Identity Federation

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: false

env:
  APP: backend
  PROJECT: shotline-511017
  ZONE: asia-south1-a
  VM: shotline-app
  # Not secrets: resource names. Access is limited by the federation's
  # attribute condition (these repos, main only) and the deployer's roles.
  WIF_PROVIDER: projects/394238727487/locations/global/workloadIdentityPools/github/providers/shotline-app
  DEPLOYER: app-deployer@shotline-511017.iam.gserviceaccount.com

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (vars.AUTO_DEPLOY == 'true' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Commit to deploy
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-$RUN_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then echo "Not a commit SHA: $sha"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $APP at $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v2

      # SSH over IAP with OS Login as the deployer. The deploy runs as a
      # systemd job on the VM, so if the connection drops we reconnect and
      # wait for its result (--status: 0 deployed, 10 running, 20 failed).
      - name: Deploy on the VM
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          vm() {
            gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet \
              --command "$1" -- -o ServerAliveInterval=20 -o ServerAliveCountMax=6
          }
          set +e
          vm "sudo /usr/local/bin/shotline-deploy $APP $SHA"; rc=$?
          set -e
          [ $rc -eq 0 ] && { echo "Deployed $APP $SHA"; exit 0; }
          echo "Deploy command ended with $rc; checking the result on the VM"
          unreachable=0
          for i in $(seq 1 150); do                          # up to ~40 minutes
            set +e; vm "sudo /usr/local/bin/shotline-deploy --status $APP $SHA"; rc=$?; set -e
            case $rc in
              0)  echo "Deployed $APP $SHA"; exit 0 ;;
              10) unreachable=0; sleep 15 ;;                  # still running
              20) echo "Deploy failed on the VM; it rolled back to the previous commit (see /var/www/shotline/deploys.log)"; exit 1 ;;
              *)  unreachable=$((unreachable + 1))             # couldn't connect or run the check
                  if [ $unreachable -ge 4 ]; then
                    echo "Couldn't reach the VM (see the errors above)"; exit 1
                  fi
                  sleep 15 ;;
            esac
          done
          echo "Timed out waiting for the deploy result"; exit 1
